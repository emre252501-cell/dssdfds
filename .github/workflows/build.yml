name: Build WDM Driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196230" -OutFile "$env:TEMP\wdksetup.exe"
        Start-Process -FilePath "$env:TEMP\wdksetup.exe" -ArgumentList "/features + /quiet /norestart" -Wait
        Write-Host "WDK installed"
      shell: powershell

    - name: Build Driver
      run: |
        set "WDKContentRoot=C:\Program Files (x86)\Windows Kits\10\"
        msbuild nvvad86v.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:KernelModeDriver=true
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nvvad86v_sys
        path: x64\Release\nvvad86v.sys
