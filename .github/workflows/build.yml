name: Build WDM Driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Install WDK via winget
      run: |
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
        $wdkPath = "$env:TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkPath
        Start-Process -FilePath $wdkPath -ArgumentList "/quiet /norestart" -Wait
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver
      run: |
        msbuild nvvad86v.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nvvad86v_sys
        path: x64\Release\nvvad86v.sys
